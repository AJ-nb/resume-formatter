<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f3">
  <meta name="application-version" content="__APP_VERSION__">
  <meta name="description" content="本地优先的简历编辑与排版工具">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23191b19'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-size='18' font-weight='700' fill='white'%3ER%3C/text%3E%3C/svg%3E">
  <title>Resume Formatter</title>
  <!-- __STYLES__ -->
</head>
<body>
  <div id="app-shell">
    <header id="command-bar">
      <div class="command-brand">
        <div class="brand-mark" aria-hidden="true">R</div>
        <div class="brand-copy"><strong>Resume Formatter</strong><span id="save-status">已保存在本机</span></div>
      </div>
      <div id="mobile-view-switch" class="segmented-control" role="tablist" aria-label="移动端视图">
        <button type="button" class="active" data-mobile-view="content" role="tab" aria-selected="true">内容</button>
        <button type="button" data-mobile-view="preview" role="tab" aria-selected="false">预览</button>
      </div>
      <div class="command-actions">
        <button id="btn-import" class="command-button" type="button" title="导入简历" aria-label="导入简历"><i data-lucide="file-up"></i><span>导入</span></button>
        <button id="btn-undo" class="icon-command" type="button" title="撤销" aria-label="撤销"><i data-lucide="undo-2"></i></button>
        <button id="btn-redo" class="icon-command" type="button" title="重做" aria-label="重做"><i data-lucide="redo-2"></i></button>
        <button id="btn-save" class="command-button primary" type="button" title="保存到本机"><i data-lucide="save"></i><span>保存</span></button>
        <div class="command-menu">
          <button id="btn-export-menu" class="icon-command" type="button" title="导出" aria-label="导出" aria-haspopup="menu"><i data-lucide="download"></i></button>
          <div id="export-menu" class="popover-menu" role="menu" hidden>
            <button id="btn-export-html" type="button" role="menuitem"><i data-lucide="file-code-2"></i>独立 HTML</button>
            <button id="btn-export-markdown" type="button" role="menuitem"><i data-lucide="file-text"></i>Markdown</button>
            <button id="btn-export-json" type="button" role="menuitem"><i data-lucide="braces"></i>简历 JSON</button>
            <button id="btn-import-workspace" type="button" role="menuitem"><i data-lucide="archive-restore"></i>恢复工作区</button>
            <button id="btn-export-workspace" type="button" role="menuitem"><i data-lucide="archive"></i>工作区 JSON</button>
            <button id="btn-print" type="button" role="menuitem"><i data-lucide="send"></i>投递 PDF</button>
          </div>
        </div>
        <button id="btn-ai-settings" class="icon-command" type="button" title="AI 设置" aria-label="AI 设置"><i data-lucide="sparkles"></i></button>
      </div>
    </header>
    <div id="app-body">
      <aside id="left-sidebar" aria-label="文档与模板">
        <div class="sidebar-tabs" role="tablist">
          <button type="button" class="active" data-sidebar-tab="document" role="tab" aria-selected="true">版本</button>
          <button type="button" data-sidebar-tab="templates" role="tab" aria-selected="false">模板</button>
        </div>
        <section id="sidebar-document" class="sidebar-panel active">
          <div class="sidebar-heading"><span>母版与岗位</span><button id="btn-new-application" class="small-icon-button" type="button" title="创建岗位版本" aria-label="创建岗位版本"><i data-lucide="plus"></i></button></div>
          <div id="workspace-document-list" class="workspace-document-list"></div>
          <div class="sidebar-divider"></div>
          <div class="sidebar-heading"><span>栏目</span><button id="btn-add-section" class="small-icon-button" type="button" title="添加栏目" aria-label="添加栏目"><i data-lucide="plus"></i></button></div>
          <nav id="section-nav" aria-label="简历栏目"></nav>
          <div class="sidebar-divider"></div>
          <div class="sidebar-heading"><span>本地版本</span><button id="btn-save-version" class="small-icon-button" type="button" title="保存版本" aria-label="保存版本"><i data-lucide="bookmark-plus"></i></button></div>
          <div id="version-list" class="version-list"></div>
        </section>
        <section id="sidebar-templates" class="sidebar-panel"><div id="template-list" class="template-list"></div></section>
      </aside>
      <main id="workspace">
        <div id="canvas-bar">
          <div id="overflow-status" class="status-pill" data-status="ok"><i data-lucide="circle-check"></i><span>单页内</span></div>
          <button id="btn-auto-fit" class="quiet-button" type="button" hidden><i data-lucide="wand-sparkles"></i>自动适配</button>
          <div id="readonly-status" class="readonly-status" hidden><i data-lucide="lock-keyhole"></i><span>已投递快照</span><button id="btn-copy-snapshot" type="button">复制继续</button></div>
          <div class="canvas-spacer"></div>
          <label class="zoom-control"><i data-lucide="zoom-out"></i><input id="zoom-slider" type="range" min="50" max="130" value="92" step="2" aria-label="预览缩放"><output id="zoom-value">92%</output></label>
        </div>
        <div id="canvas-scroll">
          <div id="mobile-editor" aria-label="结构化内容编辑"></div>
          <div id="paper-stage"><article id="resume-paper" aria-label="简历打印预览"></article></div>
        </div>
        <div id="selection-toolbar" role="toolbar" aria-label="选区工具" hidden>
          <button type="button" data-ai-rewrite="professional"><i data-lucide="sparkles"></i>专业化</button>
          <button type="button" data-ai-rewrite="concise">精炼</button>
          <button type="button" data-ai-rewrite="impact">结果导向</button>
        </div>
      </main>
      <aside id="inspector" aria-label="检查器">
        <button id="inspector-handle" type="button" aria-label="展开或收起检查器" aria-expanded="false"><span></span></button>
        <div class="inspector-tabs" role="tablist">
          <button type="button" class="active" data-inspector-tab="layout" role="tab" aria-selected="true"><i data-lucide="sliders-horizontal"></i><span>版式</span></button>
          <button type="button" data-inspector-tab="job" role="tab" aria-selected="false"><i data-lucide="briefcase-business"></i><span>岗位</span></button>
          <button type="button" data-inspector-tab="checks" role="tab" aria-selected="false"><i data-lucide="list-checks"></i><span>检查</span></button>
        </div>
        <section id="inspector-layout" class="inspector-panel active">
          <div class="inspector-section"><div class="control-row"><h2>推荐模板</h2><button id="btn-all-templates" class="text-link" type="button">全部 12 套</button></div><div id="recommended-templates" class="recommended-templates"></div><div class="segmented-control full" role="group" aria-label="纸张大小"><button type="button" data-paper="A4" class="active">A4</button><button type="button" data-paper="Letter">US Letter</button></div></div>
          <div class="inspector-section">
            <div class="control-row"><label for="font-size">字号</label><output id="font-size-value">10 pt</output></div><input id="font-size" class="range-control" type="range" min="7.5" max="12" step="0.1" value="10">
            <div class="control-row"><label for="line-height">行高</label><output id="line-height-value">1.50</output></div><input id="line-height" class="range-control" type="range" min="1.15" max="1.85" step="0.01" value="1.5">
            <div class="control-row"><label for="section-gap">栏目间距</label><output id="section-gap-value">3.6 mm</output></div><input id="section-gap" class="range-control" type="range" min="1" max="8" step="0.1" value="3.6">
          </div>
          <div class="inspector-section"><div class="control-row"><span>证件照</span><label class="switch"><input id="photo-toggle" type="checkbox"><span></span></label></div><button id="btn-photo" class="inspector-command" type="button"><i data-lucide="image-plus"></i>选择或调整照片</button></div>
        </section>
        <section id="inspector-job" class="inspector-panel">
          <div id="job-empty" class="inspector-section job-empty"><i data-lucide="briefcase-business"></i><h2>从母版创建岗位版本</h2><p>岗位信息、JD 与证据只保存在本机工作区，不进入普通简历导出。</p><button id="btn-create-job-empty" class="inspector-command strong" type="button"><i data-lucide="plus"></i>创建岗位版本</button></div>
          <div id="job-workspace" hidden>
            <div class="inspector-section"><div class="control-row"><h2>岗位任务</h2><span id="job-status" class="connection-badge">草稿</span></div><label class="inspector-field"><span>公司</span><input id="job-company" class="inspector-input" autocomplete="organization"></label><label class="inspector-field"><span>岗位</span><input id="job-role" class="inspector-input"></label><label class="inspector-field"><span>语言</span><select id="job-language" class="inspector-select"><option value="zh-CN">中文</option><option value="en">English</option></select></label><label class="inspector-field"><span>来源备注</span><input id="job-source-note" class="inspector-input" placeholder="招聘页面、内推或更新时间"></label></div>
            <div class="inspector-section"><div class="control-row"><h2>版本协作</h2><span id="master-sync-badge" class="connection-badge">已同步</span></div><div class="job-version-actions"><button id="btn-compare-master" class="inspector-command" type="button"><i data-lucide="git-compare-arrows"></i>对比母版</button><button id="btn-sync-master" class="inspector-command strong" type="button"><i data-lucide="refresh-cw"></i>同步母版</button><button id="btn-copy-application" class="inspector-command" type="button"><i data-lucide="copy-plus"></i>复制为新版本</button></div><div class="export-history"><div class="control-row"><h2>导出记录</h2><span id="export-history-count" class="field-count">0 次</span></div><div id="export-history-list"></div></div></div>
            <div class="inspector-section"><div class="control-row"><h2>岗位描述</h2><span id="job-jd-count" class="field-count">0 字</span></div><textarea id="job-jd" class="inspector-textarea" placeholder="粘贴完整 JD，仅保存在当前设备"></textarea><button id="btn-analyze-jd" class="inspector-command strong" type="button"><i data-lucide="scan-search"></i>本地分析要求</button><button id="btn-jd-compare" class="inspector-command" type="button"><i data-lucide="sparkles"></i>AI 补充对照</button></div>
            <div class="inspector-section"><div class="control-row"><h2>事实证据</h2><button id="btn-add-evidence" class="text-link" type="button">添加</button></div><div id="evidence-list" class="evidence-list"></div></div>
            <div class="inspector-section"><h2>要求匹配</h2><div id="requirement-list" class="requirement-list"></div></div>
          </div>
        </section>
        <section id="inspector-checks" class="inspector-panel">
          <div class="inspector-section checks-heading"><div class="control-row"><h2>投递检查</h2><span id="check-summary" class="connection-badge">检查中</span></div><p>确定性规则与 AI 建议分开显示，不代表真实 ATS 通过率。</p><button id="btn-quick-scan" class="inspector-command strong" type="button"><i data-lucide="scan-eye"></i>快速扫描</button><button id="btn-review-resume" class="inspector-command" type="button"><i data-lucide="sparkles"></i>AI 全文审阅</button></div>
          <div id="readability-checks" class="check-list"></div>
          <div class="inspector-section ai-status-section"><div class="control-row"><h2>AI 建议</h2><span id="ai-status-badge" class="connection-badge">未配置</span></div><p>AI 失败不会影响本地检查、证据与导出备份。</p></div>
          <div id="ai-results" class="ai-results" aria-live="polite"></div>
        </section>
      </aside>
    </div>
  </div>
  <input id="resume-file-input" type="file" accept=".md,.markdown,.json,.pdf,.docx,text/markdown,application/json,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
  <input id="workspace-file-input" type="file" accept=".json,application/json" hidden>
  <input id="photo-file-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <div id="modal-root" aria-live="polite"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script id="embedded-resume-state" type="application/json">{}</script>
  <!-- __SCRIPTS__ -->
</body>
</html>
