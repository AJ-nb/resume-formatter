<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f3">
  <meta name="description" content="本地优先的简历编辑与排版工具">
  <title>Resume Formatter</title>
  <!-- __STYLES__ -->
</head>
<body>
  <div id="app-shell">
    <header id="command-bar">
      <div class="command-brand">
        <div class="brand-mark" aria-hidden="true">R</div>
        <div class="brand-copy"><strong>Resume Formatter</strong><span id="save-status">已保存在本机</span></div>
      </div>
      <div id="mobile-view-switch" class="segmented-control" role="tablist" aria-label="移动端视图">
        <button type="button" class="active" data-mobile-view="content" role="tab" aria-selected="true">内容</button>
        <button type="button" data-mobile-view="preview" role="tab" aria-selected="false">预览</button>
      </div>
      <div class="command-actions">
        <button id="btn-import" class="command-button" type="button" title="导入简历" aria-label="导入简历"><i data-lucide="file-up"></i><span>导入</span></button>
        <button id="btn-undo" class="icon-command" type="button" title="撤销" aria-label="撤销"><i data-lucide="undo-2"></i></button>
        <button id="btn-redo" class="icon-command" type="button" title="重做" aria-label="重做"><i data-lucide="redo-2"></i></button>
        <button id="btn-save" class="command-button primary" type="button" title="保存到本机"><i data-lucide="save"></i><span>保存</span></button>
        <div class="command-menu">
          <button id="btn-export-menu" class="icon-command" type="button" title="导出" aria-label="导出" aria-haspopup="menu"><i data-lucide="download"></i></button>
          <div id="export-menu" class="popover-menu" role="menu" hidden>
            <button id="btn-export-html" type="button" role="menuitem"><i data-lucide="file-code-2"></i>独立 HTML</button>
            <button id="btn-export-markdown" type="button" role="menuitem"><i data-lucide="file-text"></i>Markdown</button>
            <button id="btn-export-json" type="button" role="menuitem"><i data-lucide="braces"></i>JSON</button>
            <button id="btn-print" type="button" role="menuitem"><i data-lucide="printer"></i>打印 PDF</button>
          </div>
        </div>
        <button id="btn-ai-settings" class="icon-command" type="button" title="AI 设置" aria-label="AI 设置"><i data-lucide="sparkles"></i></button>
      </div>
    </header>
    <div id="app-body">
      <aside id="left-sidebar" aria-label="文档与模板">
        <div class="sidebar-tabs" role="tablist">
          <button type="button" class="active" data-sidebar-tab="document" role="tab" aria-selected="true">文档</button>
          <button type="button" data-sidebar-tab="templates" role="tab" aria-selected="false">模板</button>
        </div>
        <section id="sidebar-document" class="sidebar-panel active">
          <div class="sidebar-heading"><span>栏目</span><button id="btn-add-section" class="small-icon-button" type="button" title="添加栏目" aria-label="添加栏目"><i data-lucide="plus"></i></button></div>
          <nav id="section-nav" aria-label="简历栏目"></nav>
          <div class="sidebar-divider"></div>
          <div class="sidebar-heading"><span>本地版本</span><button id="btn-save-version" class="small-icon-button" type="button" title="保存版本" aria-label="保存版本"><i data-lucide="bookmark-plus"></i></button></div>
          <div id="version-list" class="version-list"></div>
        </section>
        <section id="sidebar-templates" class="sidebar-panel"><div id="template-list" class="template-list"></div></section>
      </aside>
      <main id="workspace">
        <div id="canvas-bar">
          <div id="overflow-status" class="status-pill" data-status="ok"><i data-lucide="circle-check"></i><span>单页内</span></div>
          <button id="btn-auto-fit" class="quiet-button" type="button" hidden><i data-lucide="wand-sparkles"></i>自动适配</button>
          <div class="canvas-spacer"></div>
          <label class="zoom-control"><i data-lucide="zoom-out"></i><input id="zoom-slider" type="range" min="50" max="130" value="92" step="2" aria-label="预览缩放"><output id="zoom-value">92%</output></label>
        </div>
        <div id="canvas-scroll">
          <div id="mobile-editor" aria-label="结构化内容编辑"></div>
          <div id="paper-stage"><article id="resume-paper" aria-label="简历打印预览"></article></div>
        </div>
        <div id="selection-toolbar" role="toolbar" aria-label="选区工具" hidden>
          <button type="button" data-ai-rewrite="professional"><i data-lucide="sparkles"></i>专业化</button>
          <button type="button" data-ai-rewrite="concise">精炼</button>
          <button type="button" data-ai-rewrite="impact">结果导向</button>
        </div>
      </main>
      <aside id="inspector" aria-label="检查器">
        <button id="inspector-handle" type="button" aria-label="展开或收起检查器" aria-expanded="false"><span></span></button>
        <div class="inspector-tabs" role="tablist">
          <button type="button" class="active" data-inspector-tab="layout" role="tab" aria-selected="true"><i data-lucide="sliders-horizontal"></i><span>版式</span></button>
          <button type="button" data-inspector-tab="checks" role="tab" aria-selected="false"><i data-lucide="list-checks"></i><span>检查</span></button>
          <button type="button" data-inspector-tab="ai" role="tab" aria-selected="false"><i data-lucide="sparkles"></i><span>AI</span></button>
        </div>
        <section id="inspector-layout" class="inspector-panel active">
          <div class="inspector-section"><h2>页面</h2><div class="segmented-control full" role="group" aria-label="纸张大小"><button type="button" data-paper="A4" class="active">A4</button><button type="button" data-paper="Letter">US Letter</button></div></div>
          <div class="inspector-section">
            <div class="control-row"><label for="font-size">字号</label><output id="font-size-value">10 pt</output></div><input id="font-size" class="range-control" type="range" min="7.5" max="12" step="0.1" value="10">
            <div class="control-row"><label for="line-height">行高</label><output id="line-height-value">1.50</output></div><input id="line-height" class="range-control" type="range" min="1.15" max="1.85" step="0.01" value="1.5">
            <div class="control-row"><label for="section-gap">栏目间距</label><output id="section-gap-value">3.6 mm</output></div><input id="section-gap" class="range-control" type="range" min="1" max="8" step="0.1" value="3.6">
          </div>
          <div class="inspector-section"><div class="control-row"><span>证件照</span><label class="switch"><input id="photo-toggle" type="checkbox"><span></span></label></div><button id="btn-photo" class="inspector-command" type="button"><i data-lucide="image-plus"></i>选择或调整照片</button></div>
        </section>
        <section id="inspector-checks" class="inspector-panel">
          <div class="inspector-section checks-heading"><h2>机器可读性</h2><p>逐项规则，不代表真实 ATS 通过率。</p></div>
          <div id="readability-checks" class="check-list"></div>
        </section>
        <section id="inspector-ai" class="inspector-panel">
          <div class="inspector-section ai-status-section"><div class="control-row"><h2>AI 助手</h2><span id="ai-status-badge" class="connection-badge">未配置</span></div><p>仅在你点击改写、审阅或 JD 对照时发送相应文本。</p></div>
          <div class="inspector-section"><button id="btn-review-resume" class="inspector-command strong" type="button"><i data-lucide="scan-search"></i>全文审阅</button><button id="btn-jd-compare" class="inspector-command" type="button"><i data-lucide="file-search"></i>JD 对照</button></div>
          <div id="ai-results" class="ai-results" aria-live="polite"></div>
        </section>
      </aside>
    </div>
  </div>
  <input id="resume-file-input" type="file" accept=".md,.markdown,.json,.pdf,.docx,text/markdown,application/json,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
  <input id="photo-file-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <div id="modal-root" aria-live="polite"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script id="embedded-resume-state" type="application/json">{}</script>
  <!-- __SCRIPTS__ -->
</body>
</html>
